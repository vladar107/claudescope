name: CI

# Sanity check before merge (pull requests into main) and after merge
# (pushes to main): typecheck, build, and test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # both supported LTS lines (22 = engines floor, 24 = latest)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Build the Nix flake so a broken flake or a stale npmDepsHash is caught on PRs,
  # not first at release time. (Needs npmDepsHash filled in — see CONTRIBUTING.)
  # Matrix covers the platforms users install on: Linux x64 and macOS arm64
  # (macos-14). Intel macOS (macos-13) is omitted — GitHub is deprecating Intel
  # runners (they queue indefinitely), and the darwin-x64 build path is identical
  # to arm64 bar the binding dir. npmDepsHash is OS-independent, shared by both.
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Build the flake
        run: nix build .#claudescope -L
