name: Performance

# Interleaved same-runner A/B perf gate. On each PR, bench the PR head and the
# target branch in ALTERNATING short rounds on the SAME VM (base,cand / cand,base
# / …), then pool the raw samples per side and gate with a Mann-Whitney test.
# Alternation cancels the temporal drift that a sequential A-then-B cannot
# (shared runners routinely drift ~10-15% between two long blocks), and the
# statistical gate means a FAIL requires both a >10% pooled-median regression
# AND p < 0.01 — not a lucky/unlucky pair of medians. PR-only: the A/B needs
# both sides, and there is no diff to gate on a plain push to main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bench is `tsx packages/server/perf/run.ts` — server/data-layer only. Gate it
  # on server/shared/root-deps changes; NEVER on packages/web/** (frontend can't move
  # the backend bench). The workspace-wide lockfile is included on purpose (a backend
  # runtime-dep change could move the bench).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      perf: ${{ steps.f.outputs.perf }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            perf:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/shared/**'
              - 'packages/server/**'
              - '.github/workflows/perf.yml'
              - '.github/actions/**'

  perf:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          path: pr

      - name: Checkout base (${{ github.base_ref }})
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Setup Node + install (PR head)
        uses: ./pr/.github/actions/setup
        with:
          node-version: 24
          cache-dependency-path: pr/package-lock.json
          working-directory: pr

      # Base side stays a bare `npm ci` (node is already set up above): base must run
      # main's harness, not PR-introduced tooling. Do not route this through the
      # composite action — the base checkout may predate it.
      - name: Install deps (base)
        working-directory: base
        run: npm ci

      - name: Bench (5 interleaved A/B rounds)
        # NOTE: the base side runs main's harness — only pass flags that main's
        # run.ts already understands; a new flag needs a two-step rollout.
        run: |
          for i in 1 2 3 4 5; do
            # Alternate which side goes first to cancel order bias on top of drift.
            if [ $((i % 2)) -eq 1 ]; then order="base pr"; else order="pr base"; fi
            for side in $order; do
              if [ "$side" = pr ]; then name=cand; else name=base; fi
              # --if-present: on the PR that introduces the suite, base has no
              # bench script yet → no base files → compare no-ops (bootstrap).
              (cd "$side" && npm run bench --if-present -- \
                --out "$GITHUB_WORKSPACE/$name-$i.json" --scale 2 --runs 2)
            done
          done

      - name: Compare (fail on >10% pooled headline regression with p < 0.01)
        working-directory: pr
        run: |
          args=()
          for f in "$GITHUB_WORKSPACE"/base-*.json; do [ -e "$f" ] && args+=(--base "$f"); done
          for f in "$GITHUB_WORKSPACE"/cand-*.json; do [ -e "$f" ] && args+=(--candidate "$f"); done
          npm run bench:compare -- "${args[@]}" --threshold 10

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            cand-*.json
            base-*.json
          if-no-files-found: ignore

  # Single status check for perf, safe whether or not it's a required check: a
  # skipped `perf` (frontend/docs-only PR) still reports success here.
  perf-success:
    name: Perf success
    if: always()
    needs: [changes, perf]
    runs-on: ubuntu-latest
    steps:
      - name: Verify perf did not fail
        shell: bash
        run: |
          for r in '${{ needs.changes.result }}' '${{ needs.perf.result }}'; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::perf gate did not succeed (got '$r')"; exit 1 ;;
            esac
          done
