name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Claudescope is **local and read-only** — it never
        writes to `~/.claude`, so it's safe to share what you see. Please don't
        paste transcript content you consider private.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
      placeholder: When I open a session with…, the thread shows… but I expected…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `claudescope`
        2. Open a session / go to Search / …
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Which agent(s) does this apply to?
      description: Select all that apply. Choose "Not agent-specific" for UI, search, or analytics bugs.
      multiple: true
      options:
        - Claude Code
        - OpenAI Codex
        - JetBrains Junie
        - pi
        - opencode
        - GitHub Copilot CLI
        - Not agent-specific (UI, search, analytics, …)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claudescope version
      description: Output of `claudescope version`.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node -v`.
      placeholder: "v20.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system & version
      description: |
        The full OS version — run the command for your platform and paste the result:
        - **macOS:** `sw_vers`
        - **Linux:** `cat /etc/os-release` (or `uname -a`)
        - **Windows:** `cmd /c ver` (or `[System.Environment]::OSVersion.VersionString`)
      placeholder: "macOS 15.5 (24F74)"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & version
      description: |
        The browser you viewed Claudescope in. Find the version at:
        - **Chrome / Edge / Brave:** `chrome://version` (or `edge://version`)
        - **Firefox:** `about:support`
        - **Safari:** Safari → About Safari
      placeholder: "Chrome 126.0.6478.127"
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: Install method
      description: How did you install Claudescope?
      options:
        - npm
        - Homebrew
        - Nix
        - Built from source
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Output of `claudescope logs` (or the browser console). This is
        automatically formatted as code, so no backticks needed.
      render: shell
    validations:
      required: false
